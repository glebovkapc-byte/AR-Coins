<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>AR Монеты — 90 секунд</title>
<style>*{box-sizing:border-box}body{margin:0;background:#121518;color:white;font-family:system-ui}#scene{position:fixed;inset:0;width:100vw;height:100dvh}#ui{position:fixed;top:12px;left:12px;right:12px;max-width:480px;margin:auto;z-index:10;background:#171b25de;padding:12px;border-radius:14px;font-size:13px}button{background:#f5c454;border:0;border-radius:8px;padding:9px 12px;font-weight:700;margin:4px 5px 0 0}input{width:95px}#debug{display:none;margin-top:8px}#status{margin:5px 0}small{color:#ddd}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script></head>
<body><div id="scene"></div><div id="ui"><b>AR-картина · 90 секунд</b><div id="status">Нажми «Запустить AR»</div><button id="start">Запустить AR</button><button id="replay" hidden>Сначала</button><button id="settings" hidden>Настройки</button><div id="debug"><label>Размер сцены <input id="scale" type="range" min="0.6" max="1.6" step=".05" value="1"></label><span id="sv">1</span><br><label>Высота <input id="yoffset" type="range" min="-.2" max=".2" step=".01" value="0"></label><span id="yv">0</span></div><small>Дизайны: 5 · пол: 125 см ниже нижнего края рамы · рамка: 93 × 69 см</small></div>
<script type="module">
import * as THREE from 'three';import {MindARThree} from 'mindar-image-three';
const $=id=>document.getElementById(id),mindar=new MindARThree({container:$('scene'),imageTargetSrc:'./targets.mind',maxTrack:1});
const {renderer,scene,camera}=mindar,anchor=mindar.addAnchor(0); renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xffffff,0x7f623d,2.6));const directional=new THREE.DirectionalLight(0xffffff,2);directional.position.set(-1,2,3);scene.add(directional);
// MindAR target spans one world unit in X, representing the real 93-cm-wide frame.
const WIDTH=.93,HEIGHT=.69,FLOOR_BELOW=1.25,unit=1/WIDTH;
const INNER_HALF_X=.405*unit, INNER_TOP=.265*unit, INNER_BOTTOM=-.265*unit;
const EDGE_Y=-HEIGHT/2*unit, FLOOR_Y=-(HEIGHT/2+FLOOR_BELOW)*unit;
const DIAMETER=.075*unit,RADIUS=DIAMETER/2;
const root=new THREE.Group();anchor.group.add(root);root.rotation.set(0,0,0);
const mats=[],meshes=[],countByType=85,total=countByType*5,dummy=new THREE.Object3D();
const edge=new THREE.MeshStandardMaterial({color:0xb7832e,metalness:.76,roughness:.28});
const textureLoader=new THREE.TextureLoader();
for(let i=0;i<5;i++){
 const t=textureLoader.load(`./coin_${i+1}.png`);t.colorSpace=THREE.SRGBColorSpace;
 const face=new THREE.MeshStandardMaterial({map:t,metalness:.35,roughness:.34,side:THREE.DoubleSide,transparent:true});
 const geo=new THREE.CylinderGeometry(RADIUS,RADIUS,RADIUS*.13,40,1,false);
 const mesh=new THREE.InstancedMesh(geo,[edge,face,face],countByType);mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);mesh.frustumCulled=false;root.add(mesh);meshes.push(mesh);
}
// Stable deterministic positions: every replay is identical.
function noise(n){let x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)}
const coins=Array.from({length:total},(_,i)=>({i,type:i%5,t:0,sx:0,sy:0,sz:0,mode:'fall',speed:1,phase:noise(i+1)*6.28}));
function setup(){for(let i=0;i<total;i++){
 const c=coins[i];c.type=i%5;
 if(i===0){c.t=0;c.mode='roll';continue;}
 if(i<=10){c.t=6+(i-1)*1.35;c.mode='single';}
 else{const j=i-11;c.t=20+j*.13+noise(i)*3;c.mode='water';}
 c.sx=(noise(i*3+1)*2-1)*(INNER_HALF_X-RADIUS*1.1);
 c.sy=INNER_TOP+RADIUS*(1+noise(i+4)*4);
 c.sz=-.012;
 c.speed=(.46+noise(i+9)*.38)*unit;
 }}setup();
let playing=false,shown=false,t0=0,pausedAt=0,elapsed=0;
function reset(){elapsed=0;t0=performance.now();playing=shown;$('status').textContent='Анимация: 0 / 90 сек'}
anchor.onTargetFound=()=>{shown=true;if(!playing&&elapsed<90){playing=true;t0=performance.now()-elapsed*1000;}$('status').textContent='Картина распознана';};
anchor.onTargetLost=()=>{shown=false;if(playing){elapsed=(performance.now()-t0)/1000;playing=false;}$('status').textContent='Наведите камеру на раму';};
const rot=new THREE.Euler(),quat=new THREE.Quaternion(),temp=new THREE.Vector3();
function hide(){dummy.position.set(0,0,-1000);dummy.scale.setScalar(.00001);dummy.updateMatrix();}
function update(t){const counts=[0,0,0,0,0];let display=0;
 for(const c of coins){let x=0,y=0,z=0,spin=0,tilt=0,visible=false,local=t-c.t;const duration=2.3;
 if(local>=0){
 if(c.mode==='roll'){
  // Upright coin rolls along the inside bottom edge, then falls to a calibrated virtual floor.
  if(local<3.2){x=-INNER_HALF_X+RADIUS+(INNER_HALF_X*2-RADIUS*2)*local/3.2;y=INNER_BOTTOM+RADIUS;z=.012;spin=-local*4.3;visible=true;}
  else if(local<9){const dt=local-3.2;x=INNER_HALF_X-RADIUS+Math.min(dt,1)*.07;y=INNER_BOTTOM+RADIUS-0.5*9.81*unit*dt*dt;const bottom=FLOOR_Y+RADIUS;if(y<bottom){y=bottom;spin*=.9;}z=.10;spin=-13.7-dt*2;visible=dt<5;}
 }else if(c.mode==='single'){
  const p=local;
  x=c.sx+Math.sin(p*2+c.phase)*.045;
  // Brief emergence from bottom edge, followed by free fall outside the frame.
  y=INNER_BOTTOM+RADIUS+ Math.min(p,.38)*.18*unit- Math.max(0,p-.38)**2*2.7*unit;
  z=.04+Math.min(p,1)*.12;spin=p*7+c.phase;tilt=p*2;
  if(y<FLOOR_Y+RADIUS){y=FLOOR_Y+RADIUS;}
  visible=p<4.6;
 }else{
  const cycle=2.9+noise(c.i+11)*1.2;
  let p=local%cycle;
  x=c.sx+Math.sin(p*1.8+c.phase)*(.014+.03*noise(c.i+12));
  y=c.sy-.5*(1.8+noise(c.i+15)*1.9)*unit*p*p;
  z=-.015;
  spin=p*(4+noise(c.i+30)*7);tilt=p*2;
  // Waterfall is hidden behind the painted frame: only visible inside opening.
  const inside=x> -INNER_HALF_X+RADIUS*.7 && x<INNER_HALF_X-RADIUS*.7 && y<INNER_TOP-RADIUS*.6 && y>INNER_BOTTOM+RADIUS*.6;
  visible=inside && p<cycle;
  // After 35s some falling coins spill forward and down toward the floor.
  if(t>35 && c.i%9===0 && p>1.05){z=.10+(p-1.05)*.07;y=INNER_BOTTOM+.03-(p-1.05)*.95*unit;visible=y>FLOOR_Y-RADIUS&&p<3.3;}
 }
 }
 const mesh=meshes[c.type],index=counts[c.type]++;
 if(visible){
 dummy.position.set(x,y,z);dummy.rotation.set(Math.PI/2+tilt,spin,c.mode==='roll'?0:spin*.47);dummy.scale.setScalar(1);dummy.updateMatrix();display++;
 }else{hide();}
 mesh.setMatrixAt(index,dummy.matrix);
 }
 meshes.forEach(m=>{m.instanceMatrix.needsUpdate=true;});
 return display;
}
$('start').onclick=async()=>{const btn=$('start');btn.disabled=true;$('status').textContent='Запуск камеры...';try{await mindar.start();$('replay').hidden=false;$('settings').hidden=false;btn.hidden=true;reset();renderer.setAnimationLoop(()=>{if(playing){elapsed=(performance.now()-t0)/1000;if(elapsed>=90){elapsed=90;playing=false;}}update(elapsed);if(playing)$('status').textContent=`Анимация: ${elapsed.toFixed(1)} / 90 сек`;renderer.render(scene,camera);});}catch(e){console.error(e);$('status').textContent='Не удалось запустить камеру. Нужны HTTPS и разрешение камеры.';btn.disabled=false;}};
$('replay').onclick=reset;
$('settings').onclick=()=>$('debug').style.display=$('debug').style.display==='block'?'none':'block';
$('scale').oninput=e=>{root.scale.setScalar(+e.target.value);$('sv').textContent=e.target.value;};
$('yoffset').oninput=e=>{root.position.y=+e.target.value;$('yv').textContent=e.target.value;};
</script></body></html>
