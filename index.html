<!doctype html><html lang="ru"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AR Монеты — 90 секунд (v5.1)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141a;color:#fff;font-family:system-ui}
#scene{position:fixed;inset:0;width:100vw;height:100dvh}
#ui{position:fixed;top:10px;left:10px;right:10px;max-width:360px;margin:0 auto auto 0;z-index:10;background:#171b25d8;padding:10px 12px;border-radius:12px;font-size:12px;backdrop-filter:blur(4px)}
button{background:#f5c454;border:0;border-radius:8px;padding:8px 11px;font-weight:700;margin:4px 4px 0 0;font-size:12px}#ui b{font-size:14px;display:block;margin-bottom:2px}#status{margin:4px 0 6px}#help{display:none}#debug{display:none;margin-top:6px}
#debug{display:none;margin-top:8px}input{width:96px}small{color:#ddd}#status{margin:5px 0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/renderers/CSS3DRenderer.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/renderers/CSS3DRenderer.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head><body>
<div id="scene"></div>
<div id="ui">
  <b>AR-картина · 90 секунд <span style="color:#f5c454">v5.1 · водопад по всей ширине</span></b>
  <div id="status">Нажми «Запустить AR»</div>
  <button id="start">Запустить AR</button>
  <button id="replay" hidden>Сначала</button>
  <button id="settings" hidden>Настройки</button>
  <button id="info" hidden>Описание</button>
  <button id="sound" hidden>🔊 Звук вкл.</button>
  <div id="debug">
    <label>Размер сцены <input id="scale" type="range" min="0.6" max="1.6" step=".05" value="1.1"></label> <span id="sv">1.1</span><br>
    <label>Высота <input id="yoffset" type="range" min="-.2" max=".2" step=".01" value="0"></label> <span id="yv">0</span>
  </div>
  <small id="help">Монеты появляются немного выше за верхней кромкой рамы и идут непрерывным водопадом по всей ширине проёма. Звучит загруженная аудиодорожка. После её окончания звук повторяется.</small>
</div>
<script type="module">
const $=id=>document.getElementById(id);
let initialized=false, btnLock=false;
let playing=false, shown=false, elapsed=0, t0=0;
// User-supplied audio file: no synthesized bell sounds.
const soundtrack=new Audio('./soundtrack.mp3');
soundtrack.preload='auto'; soundtrack.loop=true; soundtrack.playsInline=true;
soundtrack.volume=.50;let soundEnabled=true;
function syncSound(t,force=false){
  if(!soundEnabled||!shown||!playing||t>=90){soundtrack.pause();return;}
  if(soundtrack.readyState>=1 && soundtrack.duration>0){
    const target=t%soundtrack.duration;
    const delta=Math.abs(soundtrack.currentTime-target);
    if(force||delta>.65) soundtrack.currentTime=target;
  }
  if(soundtrack.paused) soundtrack.play().catch(e=>console.warn('Audio playback:',e));
}

async function initialize(){
  $('status').textContent='Загружаем библиотеки AR...';
  const [THREE, mindModule] = await Promise.all([import('three'), import('mindar-image-three')]);
  const { MindARThree } = mindModule;

  const mindar=new MindARThree({container:$('scene'),imageTargetSrc:'./targets.mind',maxTrack:1});
  const {renderer,scene,camera}=mindar; const anchor=mindar.addAnchor(0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  scene.add(new THREE.HemisphereLight(0xffffff,0x7f623d,2.6));
  const directional=new THREE.DirectionalLight(0xffffff,1.95); directional.position.set(-1,2,3); scene.add(directional);

  const WIDTH=.93, HEIGHT=.69, FLOOR_BELOW=1.25, unit=1/WIDTH;
  // Smaller safe opening: a clearance keeps rotated coin edges off the ornate frame.
  const INNER_HALF_X=.375*unit, INNER_TOP=.235*unit, INNER_BOTTOM=-.265*unit, MID_Y=0;
  
  const FLOOR_Y=-(HEIGHT/2+FLOOR_BELOW)*unit;
  const DIAMETER=.075*unit, RADIUS=DIAMETER/2;
  const SAFE_MARGIN=RADIUS*1.65;
  const safeX=INNER_HALF_X-SAFE_MARGIN;
  const safeTop=INNER_TOP-SAFE_MARGIN;
  const safeBottom=INNER_BOTTOM+RADIUS*.42;
  const root=new THREE.Group(); root.scale.setScalar(1.1); anchor.group.add(root);

  const edge=new THREE.MeshStandardMaterial({color:0xb7832e,metalness:.82,roughness:.26});
  const textureLoader=new THREE.TextureLoader();
  const meshes=[]; const countByType=250; // 1224 coins total, shared via GPU instancing
  for(let i=0;i<5;i++){
    const t=textureLoader.load(`./coin_${i+1}.png`); t.colorSpace=THREE.SRGBColorSpace;
    const face=new THREE.MeshStandardMaterial({map:t,metalness:.38,roughness:.35,side:THREE.DoubleSide,transparent:true});
    const geo=new THREE.CylinderGeometry(RADIUS,RADIUS,RADIUS*.13,40,1,false);
    const mesh=new THREE.InstancedMesh(geo,[edge,face,face],countByType);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); mesh.frustumCulled=false;
    root.add(mesh); meshes.push(mesh);
  }
  const dummy=new THREE.Object3D();
  const hide=()=>{dummy.position.set(0,0,-999);dummy.scale.setScalar(.00001);dummy.updateMatrix();};
  const noise=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};
  const lerp=(a,b,t)=>a+(b-a)*t;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const easeOut=t=>1-Math.pow(1-clamp(t,0,1),2);
  const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

  const coins=[]; let cid=0; const add=(o)=>coins.push({id:cid,type:cid++%5,...o});

  // Opening rolling coin.
  add({kind:'roll', start:0, rollDur:3.2, fallDur:1.35, hold:10,
       x0:-INNER_HALF_X+RADIUS*1.2, x1:INNER_HALF_X-RADIUS*1.2, z0:.012});

  // 1 / 3 / 5 / 7 bursts.
  const burstPlan=[{count:1,start:6.2},{count:3,start:8.5},{count:5,start:11.1},{count:7,start:14.0}];
  burstPlan.forEach((grp,gi)=>{
    for(let j=0;j<grp.count;j++){
      const spread=(grp.count===1)?0:(j/(grp.count-1)-.5);
      add({kind:'burst', start:grp.start+noise(gi*10+j)*.16,
        x:spread*(INNER_HALF_X*1.15), y0:INNER_BOTTOM+RADIUS*.9,
        z0:.015+noise(gi*17+j)*.03,
        vx:(spread*.12)+(noise(j+70)-.5)*.07,
        vy:(.55+noise(j+9)*.26)*unit,
        vz:.06+noise(j+gi*13)*.08,
        g:(1.25+noise(j+44)*.8)*unit,
        spinBase:(noise(j+17)*2-1)*7.5, hold:10
      });
    }
  });

  // Continuous waterfall: no static accumulation. Every coin starts at the TOP.
  // Gradual activation over the full 90-second performance.
  const STREAM_COUNT=1207;
  for(let i=0;i<STREAM_COUNT;i++){
    const k=i/(STREAM_COUNT-1);
    add({kind:'stream',
      activeAt:19 + Math.pow(k,1.12)*57 + noise(i+101)*.35,
      phase:noise(i+111),
      edgeBand: (noise(i*2+1)*2-1)*safeX*.88,
      side: 1,
      xBase: 0,
      sway:(noise(i+121)-.5)*.018,
      topY:safeTop,
      insideDur:1.45+noise(i+141)*1.45,
      // Only a fraction of the instances spill onto the floor;
      // the rest recycle continuously through the frame.
      spill:i%10!==0,
      vx:(noise(i+161)*2-1)*.21,
      vy:(.12+noise(i+171)*.19)*unit,
      vz:.07+noise(i+181)*.13,
      g:(1.35+noise(i+191)*.8)*unit,
      hold:10,
      spinBase:(noise(i+211)*2-1)*5.8,
      tumble:(noise(i+221)*2-1)*2.7
    });
  }

  $('sound').onclick=()=>{
    soundEnabled=!soundEnabled;
    $('sound').textContent=soundEnabled?'🔊 Звук вкл.':'🔇 Звук выкл.';
    if(soundEnabled)syncSound(elapsed,true);else soundtrack.pause();
  };

  function reset(){ soundtrack.pause();soundtrack.currentTime=0; elapsed=0; t0=performance.now(); playing=shown; $('status').textContent='Анимация: 0 / 90 сек'; if(playing) syncSound(0,true); }
  anchor.onTargetFound=()=>{ shown=true; if(!playing&&elapsed<90){ playing=true; t0=performance.now()-elapsed*1000; } $('status').textContent='Картина распознана';syncSound(elapsed,true); };
  anchor.onTargetLost=()=>{ shown=false;soundtrack.pause(); if(playing){ elapsed=(performance.now()-t0)/1000; playing=false; } $('status').textContent='Наведите камеру на раму'; };

  function place(p){ dummy.position.set(p.x,p.y,p.z); dummy.rotation.set(p.rx,p.ry,p.rz); dummy.scale.setScalar(p.s||1); dummy.updateMatrix(); }

  function solveLanding(y0,vy,g,targetY){ const a=.5*g,b=-vy,c=targetY-y0; const d=Math.max(0,b*b-4*a*c); return (-b+Math.sqrt(d))/(2*a); }

  // Keep the first coin at the old physical rim height despite global 1.1 scale.
  const FIRST_COIN_RIM_Y=(INNER_BOTTOM+RADIUS)/1.1;
  function poseRoll(c,t){
    const tt=t-c.start; if(tt<0) return null;
    const landY=FLOOR_Y+RADIUS, landZ=.13;
    if(tt<=c.rollDur){ const p=easeInOut(tt/c.rollDur); return {x:lerp(c.x0,c.x1,p), y:FIRST_COIN_RIM_Y, z:c.z0, rx:Math.PI/2, ry:-tt*4.3, rz:0}; }
    if(tt<=c.rollDur+c.fallDur){ const dt=tt-c.rollDur, p=clamp(dt/c.fallDur,0,1); const y=FIRST_COIN_RIM_Y+(.08*unit)*p-.5*2.15*unit*dt*dt; return {x:c.x1+p*.06, y:Math.max(landY,y), z:lerp(c.z0,landZ,p), rx:Math.PI/2+dt*.4, ry:-c.rollDur*4.3-dt*2.6, rz:dt*.12}; }
    if(tt<=c.rollDur+c.fallDur+c.hold) return {x:c.x1+.06,y:landY,z:landZ,rx:Math.PI/2+.45,ry:-18.6,rz:.15};
    return null;
  }

  function poseBurst(c,t){
    const tt=t-c.start; if(tt<0) return null; const landY=FLOOR_Y+RADIUS, rise=.24;
    if(tt<rise){ const p=easeOut(tt/rise); return {x:c.x,y:lerp(c.y0,c.y0+.06*unit,p),z:lerp(c.z0,c.z0+.045,p),rx:Math.PI/2+tt*.8,ry:c.spinBase*tt,rz:c.spinBase*tt*.42}; }
    const dt=tt-rise; const x=c.x+c.vx*dt, y=(c.y0+.06*unit)+c.vy*dt-.5*c.g*dt*dt, z=(c.z0+.045)+c.vz*dt; const spin=c.spinBase*rise+dt*(4.4+Math.abs(c.spinBase));
    if(y>landY) return {x,y,z,rx:Math.PI/2+dt*1.15,ry:spin,rz:spin*.47};
    const tLand=solveLanding(c.y0+.06*unit,c.vy,c.g,landY), total=rise+tLand+c.hold; if(tt<=total){ return {x:c.x+c.vx*tLand,y:landY,z:(c.z0+.045)+c.vz*tLand,rx:Math.PI/2+1.2,ry:spin*1.05,rz:c.vx*3}; }
    return null;
  }

  // Coins start above the visible opening; none are born in mid-air.
  // The top strip acts as the hidden entrance. Fade-in is done by scale,
  // so a recycled coin never instantly appears fully formed in the image.
  function poseStream(c,t){
    const density=clamp((t-19)/71,0,1);
    const insideDur=c.insideDur*(1-.13*density);
    const entry=.44; // seconds spent emerging from behind the upper frame
    const fallDur=insideDur+entry;
    // Stagger initial entry in time rather than assigning an already-visible phase.
    const local=t-c.activeAt-c.phase*.7;
    if(local<0) return null;
    const innerPose=(dt)=>{
      const p=clamp(dt/fallDur,0,1);
      const x=c.edgeBand + Math.sin(dt*3+c.phase*6)*c.sway;
      const startY=safeTop+RADIUS*3.8;
      const y=lerp(startY,safeBottom,p);
      const reveal=clamp((safeTop+RADIUS*.35-y)/(RADIUS*1.65),0,1);
      const spin=c.spinBase+dt*(4+Math.abs(c.spinBase));
      // Do not display the coin above the decorative top edge.
      if(reveal<=0) return null;
      return {x,y,z:-.045,rx:Math.PI/2+c.tumble*.18,
              ry:spin,rz:c.tumble*.2,s:reveal};
    };
    if(!c.spill){
      const dt=local%fallDur;
      return innerPose(dt);
    }
    const landY=FLOOR_Y+RADIUS;
    const tLand=solveLanding(safeBottom,c.vy,c.g,landY);
    const cycle=fallDur+tLand+c.hold;
    const phase=local%cycle;
    if(phase<fallDur) return innerPose(phase);
    const dt=Math.min(tLand,phase-fallDur);
    const x=c.edgeBand + c.vx*dt;
    const z=.02+c.vz*dt;
    const y=Math.max(landY,safeBottom+c.vy*dt-.5*c.g*dt*dt);
    return {x,y,z,rx:Math.PI/2+dt*1.4,ry:c.spinBase+dt*7,rz:c.vx*2.5};
  }

  function poseFor(c,t){
    if(c.kind==='roll') return poseRoll(c,t);
    if(c.kind==='burst') return poseBurst(c,t);
    if(c.kind==='stream') return poseStream(c,t);
    return null;
  }

  function update(t){
    const counts=[0,0,0,0,0];
    for(const c of coins){
      let pose=poseFor(c,t); const mesh=meshes[c.type], idx=counts[c.type]++;
      // Fill / inside-stream coins are constrained to the picture opening.
      // Only explicitly released coins may spill past the lower edge.
      const insidePhase=c.kind==='stream' && pose && pose.z<0;
      if(pose && insidePhase){
        pose.x=clamp(pose.x,-safeX,safeX);
        // Do not clamp Y: it caused visible coins to materialize at the upper rim.
        pose.z=-.045; // behind the decorative frame's front face
      }
      if(pose) place(pose); else hide();
      mesh.setMatrixAt(idx,dummy.matrix);
    }
    meshes.forEach((m,mi)=>{ for(let i=counts[mi]; i<countByType; i++){ hide(); m.setMatrixAt(i,dummy.matrix); } m.instanceMatrix.needsUpdate=true; });
  }

  $('start').onclick=async()=>{
    const btn=$('start'); btn.disabled=true; $('status').textContent='Запуск камеры...';
    try{
      await mindar.start(); $('replay').hidden=false; $('settings').hidden=false; $('info').hidden=false; $('sound').hidden=false; btn.hidden=true; reset(); syncSound(elapsed,true);
      renderer.setAnimationLoop(()=>{ if(playing){ elapsed=(performance.now()-t0)/1000; if(elapsed>=90){ elapsed=90; playing=false; } } update(elapsed);syncSound(elapsed); if(playing) $('status').textContent=`Анимация: ${elapsed.toFixed(1)} / 90 сек`; renderer.render(scene,camera); });
    }catch(e){ console.error(e); $('status').textContent='Ошибка камеры: '+(e?.message||String(e)); btn.disabled=false; }
  };
  $('replay').onclick=reset;
  $('settings').onclick=()=>$('debug').style.display=$('debug').style.display==='block'?'none':'block';
  $('info').onclick=()=>$('help').style.display=$('help').style.display==='block'?'none':'block';
  $('scale').oninput=e=>{root.scale.setScalar(+e.target.value); $('sv').textContent=e.target.value;};
  $('yoffset').oninput=e=>{root.position.y=+e.target.value; $('yv').textContent=e.target.value;};
}

$('start').addEventListener('click', async function firstStart(){
  if(initialized||btnLock) return; btnLock=true; const btn=$('start'); btn.disabled=true;
  // Unlock HTMLAudio playback while still inside the direct user gesture.
  soundtrack.muted=true; soundtrack.play().then(()=>{soundtrack.pause();soundtrack.currentTime=0;soundtrack.muted=false;}).catch(()=>{soundtrack.muted=false;});
  try{
    $('status').textContent='Проверяем файл распознавания...';
    const response=await fetch('./targets.mind',{cache:'no-store'});
    if(!response.ok) throw new Error('targets.mind не найден (HTTP '+response.status+'). Проверь название и расположение файла на GitHub.');
    const bytes=await response.arrayBuffer(); if(bytes.byteLength<100) throw new Error('targets.mind слишком маленький или пустой');
    await initialize(); initialized=true; btnLock=false; btn.disabled=false; btn.onclick();
  }catch(e){ console.error('AR start failed',e); $('status').textContent='Ошибка: '+(e?.message||String(e)); btn.disabled=false; btnLock=false; }
});
window.addEventListener('unhandledrejection',e=>{ console.error(e.reason); $('status').textContent='Ошибка загрузки: '+(e.reason?.message||String(e.reason)); });
</script></body></html>
