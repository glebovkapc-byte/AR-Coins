<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR — Монеты</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#10141c;color:#fff}#ar{width:100vw;height:100dvh;position:fixed;inset:0}#panel{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;z-index:20;background:#131a24db;border:1px solid #ffffff33;border-radius:14px;padding:12px 15px;max-width:580px;margin:auto;font-size:14px}button{background:#e7b63d;color:#171717;border:0;border-radius:10px;font-weight:700;padding:11px 15px;margin-top:8px;font-size:15px}button:disabled{opacity:.4}#details{font-size:12px;opacity:.75;margin-top:6px}#controls{display:flex;gap:10px;flex-wrap:wrap}input[type=range]{width:150px;vertical-align:middle}#adjust{display:none;margin-top:8px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head>
<body><div id="ar"></div><div id="panel"><b>AR-картина: монеты</b><div id="status">Нажмите «Запустить AR», затем наведите телефон на картину.</div><div id="details">При распознавании картинки анимация воспроизводится один раз.</div><div id="controls"><button id="start">Запустить AR</button><button id="replay" style="display:none">Повторить</button></div><div id="adjust">Масштаб <input id="size" type="range" min="0.15" max="2" step="0.05" value="0.7"><span id="sizeText">0.70</span></div></div>
<script type="module">
import * as THREE from 'three';
import {MindARThree} from 'mindar-image-three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id);
let mindar,renderer,scene,camera,anchor, mixer,clips=[],model,playing=false,detected=false;
const clock=new THREE.Clock();
function resetPlay(){if(!mixer||!clips.length)return;mixer.stopAllAction();mixer.setTime(0);for(const clip of clips){const action=mixer.clipAction(clip);action.reset();action.setLoop(THREE.LoopOnce,1);action.clampWhenFinished=true;action.play()}playing=true;}
async function init(){
 $('start').disabled=true;$('status').textContent='Загружаем 3D-монеты...';
 try{
  const gltf=await new GLTFLoader().loadAsync('./flying_coins.glb');
  clips=gltf.animations;model=gltf.scene;
  // Center the animated scene around the printed image. Source has large Blender coordinates.
  // Translation animation tracks contain absolute values; centering a wrapper preserves their motion.
  const base= new THREE.Group();base.add(model);
  const bbox = new THREE.Box3().setFromObject(model);const center=bbox.getCenter(new THREE.Vector3());const dimensions=bbox.getSize(new THREE.Vector3());
  const maxDimension=Math.max(dimensions.x,dimensions.y,dimensions.z,1);
  model.position.sub(center);
  base.scale.setScalar(0.7/maxDimension);
  const applySize=()=>{base.scale.setScalar(Number($('size').value)/maxDimension);$('sizeText').textContent=Number($('size').value).toFixed(2)};
  $('size').addEventListener('input',applySize);
  mixer=new THREE.AnimationMixer(model);
  $('status').textContent=`Загружено: ${clips.length} анимаций. Запускаем камеру...`;
  mindar=new MindARThree({container:$('ar'),imageTargetSrc:'./targets.mind',maxTrack:1});
  ({renderer,scene,camera}=mindar);anchor=mindar.addAnchor(0);anchor.group.add(base);
  scene.add(new THREE.HemisphereLight(0xffffff,0xaaaaaa,2.6));
  const directional = new THREE.DirectionalLight(0xffffff,2);directional.position.set(0,1,2);scene.add(directional);
  anchor.onTargetFound=()=>{detected=true;$('status').textContent='Картина распознана — воспроизводим монеты';$('replay').style.display='inline-block';$('adjust').style.display='block';if(!playing)resetPlay()};
  anchor.onTargetLost=()=>{detected=false;$('status').textContent='Направьте камеру на картину'};
  $('replay').addEventListener('click',resetPlay);
  await mindar.start();
  $('start').style.display='none';$('status').textContent='Направьте камеру на картину';
  clock.start();renderer.setAnimationLoop(()=>{const delta=Math.min(clock.getDelta(),0.1);if(detected&&mixer)mixer.update(delta);renderer.render(scene,camera)});
 }catch(err){console.error(err);$('status').textContent='Ошибка: '+(err?.message||err);$('start').disabled=false;}
}
$('start').addEventListener('click',init);
</script></body></html>
