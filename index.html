<!doctype html><html lang="ru"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AR Монеты — 90 секунд (v3.9)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141a;color:#fff;font-family:system-ui}
#scene{position:fixed;inset:0;width:100vw;height:100dvh}
#ui{position:fixed;top:12px;left:12px;right:12px;max-width:540px;margin:auto;z-index:10;background:#171b25de;padding:12px;border-radius:14px;font-size:13px}
button{background:#f5c454;border:0;border-radius:8px;padding:9px 12px;font-weight:700;margin:4px 5px 0 0}
#debug{display:none;margin-top:8px}input{width:96px}small{color:#ddd}#status{margin:5px 0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/renderers/CSS3DRenderer.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/renderers/CSS3DRenderer.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head><body>
<div id="scene"></div>
<div id="ui">
  <b>AR-картина · 90 секунд <span style="color:#f5c454">v3.9 · непрерывный поток</span></b>
  <div id="status">Нажми «Запустить AR»</div>
  <button id="start">Запустить AR</button>
  <button id="replay" hidden>Сначала</button>
  <button id="settings" hidden>Настройки</button>
  <div id="debug">
    <label>Размер сцены <input id="scale" type="range" min="0.6" max="1.6" step=".05" value="1"></label> <span id="sv">1</span><br>
    <label>Высота <input id="yoffset" type="range" min="-.2" max=".2" step=".01" value="0"></label> <span id="yv">0</span>
  </div>
  <small>Сценарий: 1 монета → 1 / 3 / 5 / 7 → непрерывный нарастающий поток. Нижняя половина картины постепенно заполняется монетами. После этого поток усиливается, монеты вываливаются наружу, а на полу лежат 10 секунд и исчезают.</small>
</div>
<script type="module">
const $=id=>document.getElementById(id);
let initialized=false, btnLock=false;
async function initialize(){
  $('status').textContent='Загружаем библиотеки AR...';
  const [THREE, mindModule] = await Promise.all([import('three'), import('mindar-image-three')]);
  const { MindARThree } = mindModule;

  const mindar=new MindARThree({container:$('scene'),imageTargetSrc:'./targets.mind',maxTrack:1});
  const {renderer,scene,camera}=mindar; const anchor=mindar.addAnchor(0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  scene.add(new THREE.HemisphereLight(0xffffff,0x7f623d,2.6));
  const directional=new THREE.DirectionalLight(0xffffff,1.95); directional.position.set(-1,2,3); scene.add(directional);

  const WIDTH=.93, HEIGHT=.69, FLOOR_BELOW=1.25, unit=1/WIDTH;
  const INNER_HALF_X=.405*unit, INNER_TOP=.265*unit, INNER_BOTTOM=-.265*unit, MID_Y=0;
  const FLOOR_Y=-(HEIGHT/2+FLOOR_BELOW)*unit;
  const DIAMETER=.075*unit, RADIUS=DIAMETER/2;
  const root=new THREE.Group(); anchor.group.add(root);

  const edge=new THREE.MeshStandardMaterial({color:0xb7832e,metalness:.82,roughness:.26});
  const textureLoader=new THREE.TextureLoader();
  const meshes=[]; const countByType=100; // 500 coins total
  for(let i=0;i<5;i++){
    const t=textureLoader.load(`./coin_${i+1}.png`); t.colorSpace=THREE.SRGBColorSpace;
    const face=new THREE.MeshStandardMaterial({map:t,metalness:.38,roughness:.35,side:THREE.DoubleSide,transparent:true});
    const geo=new THREE.CylinderGeometry(RADIUS,RADIUS,RADIUS*.13,40,1,false);
    const mesh=new THREE.InstancedMesh(geo,[edge,face,face],countByType);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); mesh.frustumCulled=false;
    root.add(mesh); meshes.push(mesh);
  }
  const dummy=new THREE.Object3D();
  const hide=()=>{dummy.position.set(0,0,-999);dummy.scale.setScalar(.00001);dummy.updateMatrix();};
  const noise=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};
  const lerp=(a,b,t)=>a+(b-a)*t;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const easeOut=t=>1-Math.pow(1-clamp(t,0,1),2);
  const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

  const coins=[]; let cid=0; const add=(o)=>coins.push({id:cid,type:cid++%5,...o});

  // Opening rolling coin.
  add({kind:'roll', start:0, rollDur:3.2, fallDur:1.35, hold:10,
       x0:-INNER_HALF_X+RADIUS*1.2, x1:INNER_HALF_X-RADIUS*1.2, z0:.012});

  // 1 / 3 / 5 / 7 bursts.
  const burstPlan=[{count:1,start:6.2},{count:3,start:8.5},{count:5,start:11.1},{count:7,start:14.0}];
  burstPlan.forEach((grp,gi)=>{
    for(let j=0;j<grp.count;j++){
      const spread=(grp.count===1)?0:(j/(grp.count-1)-.5);
      add({kind:'burst', start:grp.start+noise(gi*10+j)*.16,
        x:spread*(INNER_HALF_X*1.15), y0:INNER_BOTTOM+RADIUS*.9,
        z0:.015+noise(gi*17+j)*.03,
        vx:(spread*.12)+(noise(j+70)-.5)*.07,
        vy:(.55+noise(j+9)*.26)*unit,
        vz:.06+noise(j+gi*13)*.08,
        g:(1.25+noise(j+44)*.8)*unit,
        spinBase:(noise(j+17)*2-1)*7.5, hold:10
      });
    }
  });

  // Coins that gradually fill ONLY the lower half of the picture and stay there.
  const FILL_COUNT=155;
  for(let i=0;i<FILL_COUNT;i++){
    const col=i%11, row=Math.floor(i/11); // 11 columns, many rows
    const xBase=lerp(-INNER_HALF_X+RADIUS*1.4, INNER_HALF_X-RADIUS*1.4, col/10);
    const jitterX=(noise(i+13)-.5)*RADIUS*.8;
    const rowCount=15;
    const yBase=lerp(INNER_BOTTOM+RADIUS*1.1, MID_Y-RADIUS*1.4, clamp((row+noise(i+21)*.7)/(rowCount-1),0,1));
    const start=19 + Math.pow(i/(FILL_COUNT-1),1.25)*11 + noise(i+33)*.28; // 19..30
    add({kind:'fill', start, x:xBase+jitterX, yTarget:yBase,
      yTop:INNER_TOP+RADIUS*(1.2+noise(i+41)*2.6), z:-.012,
      fillDur:.9+noise(i+55)*1.35, settle:(noise(i+67)-.5)*.015,
      spinBase:(noise(i+79)*2-1)*4.1});
  }

  // Continuous stream coins: always flowing, increasing in amount over time.
  // Some stay inside, some spill outward after 29s, but there are no global breaks.
  const STREAM_COUNT=328;
  for(let i=0;i<STREAM_COUNT;i++){
    const activated=19 + Math.pow(i/(STREAM_COUNT-1),1.7)*54 + noise(i+101)*.4; // more coins active later
    add({kind:'stream', activeAt:activated,
      phase:noise(i+111),
      xBase:(noise(i*2+1)*2-1)*(INNER_HALF_X-RADIUS*1.1),
      sway:(noise(i+121)-.5)*.065,
      topY:INNER_TOP+RADIUS*(.7+noise(i+131)*2.2),
      insideDur:1.45+noise(i+141)*1.2,
      spillBias:noise(i+151),
      vx:(noise(i+161)*2-1)*.21,
      vy:(.22+noise(i+171)*.24)*unit,
      vz:.09+noise(i+181)*.17,
      g:(1.32+noise(i+191)*.86)*unit,
      hold:10,
      restGap:.15+noise(i+201)*.25,
      spinBase:(noise(i+211)*2-1)*5.8,
      tumble:(noise(i+221)*2-1)*2.7
    });
  }

  let playing=false, shown=false, elapsed=0, t0=0;
  function reset(){ elapsed=0; t0=performance.now(); playing=shown; $('status').textContent='Анимация: 0 / 90 сек'; }
  anchor.onTargetFound=()=>{ shown=true; if(!playing&&elapsed<90){ playing=true; t0=performance.now()-elapsed*1000; } $('status').textContent='Картина распознана'; };
  anchor.onTargetLost=()=>{ shown=false; if(playing){ elapsed=(performance.now()-t0)/1000; playing=false; } $('status').textContent='Наведите камеру на раму'; };

  function place(p){ dummy.position.set(p.x,p.y,p.z); dummy.rotation.set(p.rx,p.ry,p.rz); dummy.scale.setScalar(p.s||1); dummy.updateMatrix(); }

  function solveLanding(y0,vy,g,targetY){ const a=.5*g,b=-vy,c=targetY-y0; const d=Math.max(0,b*b-4*a*c); return (-b+Math.sqrt(d))/(2*a); }

  function poseRoll(c,t){
    const tt=t-c.start; if(tt<0) return null;
    const landY=FLOOR_Y+RADIUS, landZ=.13;
    if(tt<=c.rollDur){ const p=easeInOut(tt/c.rollDur); return {x:lerp(c.x0,c.x1,p), y:INNER_BOTTOM+RADIUS, z:c.z0, rx:Math.PI/2, ry:-tt*4.3, rz:0}; }
    if(tt<=c.rollDur+c.fallDur){ const dt=tt-c.rollDur, p=clamp(dt/c.fallDur,0,1); const y=(INNER_BOTTOM+RADIUS)+(.08*unit)*p-.5*2.15*unit*dt*dt; return {x:c.x1+p*.06, y:Math.max(landY,y), z:lerp(c.z0,landZ,p), rx:Math.PI/2+dt*.4, ry:-c.rollDur*4.3-dt*2.6, rz:dt*.12}; }
    if(tt<=c.rollDur+c.fallDur+c.hold) return {x:c.x1+.06,y:landY,z:landZ,rx:Math.PI/2+.45,ry:-18.6,rz:.15};
    return null;
  }

  function poseBurst(c,t){
    const tt=t-c.start; if(tt<0) return null; const landY=FLOOR_Y+RADIUS, rise=.24;
    if(tt<rise){ const p=easeOut(tt/rise); return {x:c.x,y:lerp(c.y0,c.y0+.06*unit,p),z:lerp(c.z0,c.z0+.045,p),rx:Math.PI/2+tt*.8,ry:c.spinBase*tt,rz:c.spinBase*tt*.42}; }
    const dt=tt-rise; const x=c.x+c.vx*dt, y=(c.y0+.06*unit)+c.vy*dt-.5*c.g*dt*dt, z=(c.z0+.045)+c.vz*dt; const spin=c.spinBase*rise+dt*(4.4+Math.abs(c.spinBase));
    if(y>landY) return {x,y,z,rx:Math.PI/2+dt*1.15,ry:spin,rz:spin*.47};
    const tLand=solveLanding(c.y0+.06*unit,c.vy,c.g,landY), total=rise+tLand+c.hold; if(tt<=total){ return {x:c.x+c.vx*tLand,y:landY,z:(c.z0+.045)+c.vz*tLand,rx:Math.PI/2+1.2,ry:spin*1.05,rz:c.vx*3}; }
    return null;
  }

  function poseFill(c,t){
    const tt=t-c.start; if(tt<0) return null;
    if(tt<c.fillDur){ const p=easeOut(tt/c.fillDur); return {x:c.x,y:lerp(c.yTop,c.yTarget,p),z:c.z,rx:Math.PI/2+c.settle*p,ry:c.spinBase*tt*1.4,rz:c.settle*.7}; }
    return {x:c.x,y:c.yTarget,z:c.z,rx:Math.PI/2+c.settle,ry:c.spinBase*.25,rz:c.settle*.7};
  }

  function poseStream(c,t){
    if(t<c.activeAt) return null;
    const density=clamp((t-19)/61,0,1); // grows until the end
    const insideDur=Math.max(.95,c.insideDur - density*.22);
    const overflowStart=29;
    const spillProgress=clamp((t-overflowStart)/26,0,1); // after 29 spill grows steadily
    const willSpill = (t>=overflowStart) && (c.spillBias < spillProgress*.92);

    if(!willSpill){
      // Continuous inside-only falling, immediate respawn -> no visible gaps.
      const phase=((t-c.activeAt+c.phase*insideDur)%insideDur+insideDur)%insideDur;
      const p=phase/insideDur;
      const x=c.xBase + Math.sin((t+c.phase*8)*1.5)*c.sway;
      const y=lerp(c.topY, INNER_BOTTOM+RADIUS*1.05, p);
      const z=-.012;
      const spin=c.spinBase + phase*(4.4+Math.abs(c.spinBase));
      return {x,y,z,rx:Math.PI/2+c.tumble*.18,ry:spin,rz:c.tumble*.22};
    }

    // Spill cycle: inside fall -> out and down -> hold 10s on floor -> respawn.
    const riseFactor=1-density*.1;
    const tLand=solveLanding(INNER_BOTTOM+RADIUS*1.05,c.vy*riseFactor,c.g,FLOOR_Y+RADIUS);
    const outDur=insideDur + tLand;
    const cycle=outDur + c.hold + c.restGap;
    const phase=((t-c.activeAt+c.phase*cycle)%cycle+cycle)%cycle;

    if(phase<insideDur){
      const p=phase/insideDur;
      const x=c.xBase + Math.sin((phase+c.phase)*4)*c.sway;
      const y=lerp(c.topY, INNER_BOTTOM+RADIUS*1.05, p);
      return {x,y,z:-.009,rx:Math.PI/2+c.tumble*.18,ry:c.spinBase+phase*4.8,rz:c.tumble*.22};
    }
    if(phase<outDur){
      const dt=phase-insideDur;
      const x0=c.xBase, y0=INNER_BOTTOM+RADIUS*1.05, z0=.02;
      const x=x0 + c.vx*dt, y=y0 + c.vy*riseFactor*dt - .5*c.g*dt*dt, z=z0 + c.vz*dt;
      const yy=Math.max(FLOOR_Y+RADIUS,y);
      return {x,y:yy,z,rx:Math.PI/2+dt*1.6,ry:c.spinBase+phase*(5.2+Math.abs(c.spinBase)*.4),rz:c.vx*3.2};
    }
    if(phase<outDur+c.hold){
      const lx=c.xBase + c.vx*tLand, lz=.02 + c.vz*tLand;
      return {x:lx,y:FLOOR_Y+RADIUS,z:lz,rx:Math.PI/2+1.5,ry:c.spinBase*1.1,rz:c.vx*3.2};
    }
    return null;
  }

  function poseFor(c,t){
    if(c.kind==='roll') return poseRoll(c,t);
    if(c.kind==='burst') return poseBurst(c,t);
    if(c.kind==='fill') return poseFill(c,t);
    if(c.kind==='stream') return poseStream(c,t);
    return null;
  }

  function update(t){
    const counts=[0,0,0,0,0];
    for(const c of coins){
      const pose=poseFor(c,t), mesh=meshes[c.type], idx=counts[c.type]++;
      if(pose) place(pose); else hide();
      mesh.setMatrixAt(idx,dummy.matrix);
    }
    meshes.forEach((m,mi)=>{ for(let i=counts[mi]; i<countByType; i++){ hide(); m.setMatrixAt(i,dummy.matrix); } m.instanceMatrix.needsUpdate=true; });
  }

  $('start').onclick=async()=>{
    const btn=$('start'); btn.disabled=true; $('status').textContent='Запуск камеры...';
    try{
      await mindar.start(); $('replay').hidden=false; $('settings').hidden=false; btn.hidden=true; reset();
      renderer.setAnimationLoop(()=>{ if(playing){ elapsed=(performance.now()-t0)/1000; if(elapsed>=90){ elapsed=90; playing=false; } } update(elapsed); if(playing) $('status').textContent=`Анимация: ${elapsed.toFixed(1)} / 90 сек`; renderer.render(scene,camera); });
    }catch(e){ console.error(e); $('status').textContent='Ошибка камеры: '+(e?.message||String(e)); btn.disabled=false; }
  };
  $('replay').onclick=reset;
  $('settings').onclick=()=>$('debug').style.display=$('debug').style.display==='block'?'none':'block';
  $('scale').oninput=e=>{root.scale.setScalar(+e.target.value); $('sv').textContent=e.target.value;};
  $('yoffset').oninput=e=>{root.position.y=+e.target.value; $('yv').textContent=e.target.value;};
}

$('start').addEventListener('click', async function firstStart(){
  if(initialized||btnLock) return; btnLock=true; const btn=$('start'); btn.disabled=true;
  try{
    $('status').textContent='Проверяем файл распознавания...';
    const response=await fetch('./targets.mind',{cache:'no-store'});
    if(!response.ok) throw new Error('targets.mind не найден (HTTP '+response.status+'). Проверь название и расположение файла на GitHub.');
    const bytes=await response.arrayBuffer(); if(bytes.byteLength<100) throw new Error('targets.mind слишком маленький или пустой');
    await initialize(); initialized=true; btnLock=false; btn.disabled=false; btn.onclick();
  }catch(e){ console.error('AR start failed',e); $('status').textContent='Ошибка: '+(e?.message||String(e)); btn.disabled=false; btnLock=false; }
});
window.addEventListener('unhandledrejection',e=>{ console.error(e.reason); $('status').textContent='Ошибка загрузки: '+(e.reason?.message||String(e.reason)); });
</script></body></html>
