<!doctype html><html lang="ru"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AR Монеты — 90 секунд (v3.8)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141a;color:#fff;font-family:system-ui}
#scene{position:fixed;inset:0;width:100vw;height:100dvh}
#ui{position:fixed;top:12px;left:12px;right:12px;max-width:520px;margin:auto;z-index:10;background:#171b25de;padding:12px;border-radius:14px;font-size:13px}
button{background:#f5c454;border:0;border-radius:8px;padding:9px 12px;font-weight:700;margin:4px 5px 0 0}
#debug{display:none;margin-top:8px}input{width:96px}small{color:#ddd}#status{margin:5px 0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/renderers/CSS3DRenderer.js":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/renderers/CSS3DRenderer.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head><body>
<div id="scene"></div>
<div id="ui">
  <b>AR-картина · 90 секунд <span style="color:#f5c454">v3.8 · новая драматургия без звука</span></b>
  <div id="status">Нажми «Запустить AR»</div>
  <button id="start">Запустить AR</button>
  <button id="replay" hidden>Сначала</button>
  <button id="settings" hidden>Настройки</button>
  <div id="debug">
    <label>Размер сцены <input id="scale" type="range" min="0.6" max="1.6" step=".05" value="1"></label> <span id="sv">1</span><br>
    <label>Высота <input id="yoffset" type="range" min="-.2" max=".2" step=".01" value="0"></label> <span id="yv">0</span>
  </div>
  <small>Сценарий: 1 монета → 1 / 3 / 5 / 7 → 10 секунд заполнения картины → водопад, разлёт и пол. Монеты на полу исчезают через 10 секунд.</small>
</div>
<script type="module">
const $=id=>document.getElementById(id);
let initialized=false, btnLock=false;
async function initialize(){
  $('status').textContent='Загружаем библиотеки AR...';
  const [THREE, mindModule] = await Promise.all([import('three'), import('mindar-image-three')]);
  const { MindARThree } = mindModule;

  const mindar=new MindARThree({container:$('scene'),imageTargetSrc:'./targets.mind',maxTrack:1});
  const {renderer,scene,camera}=mindar; const anchor=mindar.addAnchor(0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  scene.add(new THREE.HemisphereLight(0xffffff,0x7f623d,2.6));
  const directional=new THREE.DirectionalLight(0xffffff,1.9); directional.position.set(-1,2,3); scene.add(directional);

  // Real frame: 93 x 69 cm. MindAR target width == 1 unit.
  const WIDTH=.93, HEIGHT=.69, FLOOR_BELOW=1.25, unit=1/WIDTH;
  const INNER_HALF_X=.405*unit, INNER_TOP=.265*unit, INNER_BOTTOM=-.265*unit;
  const FLOOR_Y=-(HEIGHT/2+FLOOR_BELOW)*unit;
  const DIAMETER=.075*unit, RADIUS=DIAMETER/2;
  const root=new THREE.Group(); anchor.group.add(root);

  // Coin geometry and materials.
  const edge=new THREE.MeshStandardMaterial({color:0xb7832e,metalness:.82,roughness:.26});
  const textureLoader=new THREE.TextureLoader();
  const meshes=[]; const countByType=84; // 84 * 5 = 420 instanced coins
  for(let i=0;i<5;i++){
    const t=textureLoader.load(`./coin_${i+1}.png`); t.colorSpace=THREE.SRGBColorSpace;
    const face=new THREE.MeshStandardMaterial({map:t,metalness:.38,roughness:.35,side:THREE.DoubleSide,transparent:true});
    const geo=new THREE.CylinderGeometry(RADIUS,RADIUS,RADIUS*.13,40,1,false);
    const mesh=new THREE.InstancedMesh(geo,[edge,face,face],countByType);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); mesh.frustumCulled=false;
    root.add(mesh); meshes.push(mesh);
  }
  const dummy=new THREE.Object3D();
  const hide=()=>{dummy.position.set(0,0,-999);dummy.scale.setScalar(.00001);dummy.updateMatrix();};
  const noise=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};
  const lerp=(a,b,t)=>a+(b-a)*t;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const easeOut=t=>1-Math.pow(1-clamp(t,0,1),2);
  const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

  // ------------ Coin scripts ------------
  const coins=[];
  let id=0;
  const add=(obj)=>coins.push({id:id++, type:id%5, ...obj});

  // 1) Opening rolling coin.
  add({kind:'roll', start:0, rollDur:3.2, fallDur:1.35, hold:10,
       x0:-INNER_HALF_X+RADIUS*1.2, x1:INNER_HALF_X-RADIUS*1.2, z0:.012});

  // 2) Burst groups: 1, then 3, then 5, then 7. Different speeds.
  const burstPlan=[{count:1,start:6.2},{count:3,start:8.5},{count:5,start:11.2},{count:7,start:14.4}];
  burstPlan.forEach((grp,gi)=>{
    for(let j=0;j<grp.count;j++){
      const spread=(grp.count===1)?0:(j/(grp.count-1)-.5);
      add({kind:'burst', group:gi, start:grp.start+noise(gi*10+j)*.18,
        x:spread*(INNER_HALF_X*1.15), y0:INNER_BOTTOM+RADIUS*.9,
        z0:.015+noise(gi*17+j)*.03,
        vx:(spread*.12)+(noise(j+70)-.5)*.06,
        vy:(.58+noise(j+9)*.24)*unit,
        vz:.06+noise(j+gi*13)*.08,
        g:(1.25+noise(j+44)*.85)*unit,
        spinBase:(noise(j+17)*2-1)*7.5, hold:10
      });
    }
  });

  // 3) Waterfall pool. First 10 sec (19..29) fills the image. After 29 it spills outward.
  const WATER_COUNT=403; // total 420 coins overall
  for(let i=0;i<WATER_COUNT;i++){
    const rx=(noise(i*2+1)*2-1)*(INNER_HALF_X-RADIUS*1.1);
    const restBand = i%11;
    const row = Math.floor(i/11)%24;
    const restY = lerp(INNER_BOTTOM+RADIUS*1.2, INNER_TOP-RADIUS*1.6, clamp((row+noise(i+40)*.65)/23,0,1));
    const fillStart = 19 + noise(i*3+2)*10; // within the first 10 seconds of waterfall
    add({kind:'water', start:fillStart,
      restX:rx, restY,
      fillDur:.75+noise(i+13)*1.3,
      sway:(noise(i+30)-.5)*.055,
      spillDelay:noise(i+60)*2.6,
      vx:(noise(i+90)*2-1)*.19,
      vy:(.28+noise(i+120)*.22)*unit,
      vz:.10+noise(i+150)*.16,
      g:(1.35+noise(i+180)*.85)*unit,
      cycle:14.5+noise(i+210)*2.5,
      topY:INNER_TOP+RADIUS*(.8+noise(i+240)*2.4),
      hold:10,
      spinBase:(noise(i+270)*2-1)*6.2,
      tumble:(noise(i+310)*2-1)*2.4
    });
  }

  let playing=false, shown=false, elapsed=0, t0=0;
  function reset(){ elapsed=0; t0=performance.now(); playing=shown; $('status').textContent='Анимация: 0 / 90 сек'; }
  anchor.onTargetFound=()=>{ shown=true; if(!playing && elapsed<90){ playing=true; t0=performance.now()-elapsed*1000; } $('status').textContent='Картина распознана'; };
  anchor.onTargetLost=()=>{ shown=false; if(playing){ elapsed=(performance.now()-t0)/1000; playing=false; } $('status').textContent='Наведите камеру на раму'; };

  function placeCoin(x,y,z,rx,ry,rz,scale=1){ dummy.position.set(x,y,z); dummy.rotation.set(rx,ry,rz); dummy.scale.setScalar(scale); dummy.updateMatrix(); }

  function updateCoin(c,t){
    const tt=t-c.start;
    if(c.kind==='roll'){
      const landY=FLOOR_Y+RADIUS; const landZ=.13;
      if(tt<0) return null;
      if(tt<=c.rollDur){
        const p=easeInOut(tt/c.rollDur);
        const x=lerp(c.x0,c.x1,p), y=INNER_BOTTOM+RADIUS, z=c.z0;
        const spin=-tt*4.3;
        return {x,y,z,rx:Math.PI/2,ry:spin,rz:0};
      }
      if(tt<=c.rollDur+c.fallDur){
        const dt=tt-c.rollDur, p=clamp(dt/c.fallDur,0,1);
        const x=c.x1 + p*.06, y=(INNER_BOTTOM+RADIUS) + (.08*unit)*p - .5*2.15*unit*dt*dt;
        const z=lerp(c.z0,landZ,p);
        const yy=Math.max(landY,y);
        const spin=-c.rollDur*4.3-dt*2.6;
        return {x,y:yy,z,rx:Math.PI/2+dt*.4,ry:spin,rz:dt*.12, landed:yy===landY, landTime:c.start+c.rollDur+c.fallDur};
      }
      if(tt<=c.rollDur+c.fallDur+c.hold){
        const x=c.x1+.06, y=landY, z=landZ;
        return {x,y,z,rx:Math.PI/2+.45,ry:-18.6,rz:.15};
      }
      return null;
    }

    if(c.kind==='burst'){
      if(tt<0) return null;
      const landY=FLOOR_Y+RADIUS;
      const rise=.24;
      if(tt<rise){
        const p=easeOut(tt/rise);
        const x=c.x, y=lerp(c.y0,c.y0+.06*unit,p), z=lerp(c.z0,c.z0+.045,p);
        const spin=c.spinBase*tt;
        return {x,y,z,rx:Math.PI/2+tt*.8,ry:spin,rz:spin*.42};
      }
      const dt=tt-rise;
      const x=c.x + c.vx*dt, y=(c.y0+.06*unit) + c.vy*dt - .5*c.g*dt*dt, z=(c.z0+.045) + c.vz*dt;
      const spin=c.spinBase*rise + dt*(4.4+Math.abs(c.spinBase));
      if(y>landY){
        return {x,y,z,rx:Math.PI/2+dt*1.15,ry:spin,rz:spin*.47};
      }
      const tLand=(c.vy + Math.sqrt(c.vy*c.vy + 2*c.g*((c.y0+.06*unit)-landY)))/c.g;
      const totalActive=rise+tLand+c.hold;
      if(tt<=totalActive){
        const lx=c.x + c.vx*tLand, lz=(c.z0+.045)+c.vz*tLand;
        return {x:lx,y:landY,z:lz,rx:Math.PI/2+1.2,ry:spin*1.05,rz:c.vx*3};
      }
      return null;
    }

    if(c.kind==='water'){
      if(t<c.start) return null;
      // PHASE A: fill the picture for the first 10 seconds of the waterfall (19..29).
      if(t<29){
        const local=t-c.start;
        if(local<0) return null;
        const p=clamp(local/c.fillDur,0,1);
        const x=c.restX + Math.sin(local*2.1 + c.id)*c.sway*(1-p);
        const y=lerp(c.topY,c.restY,easeOut(p));
        const z=-.012;
        const spin=local*(2.6+Math.abs(c.spinBase)*.5);
        return {x,y,z,rx:Math.PI/2+c.tumble*p,ry:spin,rz:c.tumble*.35};
      }
      // Between start and 29 the coin has already accumulated inside the frame.
      const releaseGlobal = 29 + c.spillDelay;
      if(t<releaseGlobal){
        return {x:c.restX,y:c.restY,z:-.012,rx:Math.PI/2+c.tumble*.9,ry:c.spinBase,rz:c.tumble*.35};
      }
      // PHASE B: repeated spill cycles. Coins overflow, fly out, then remain on the floor for 10 sec.
      const cyclePos=(t-releaseGlobal)%c.cycle;
      const spillDur=1.75;
      const holdStart=spillDur;
      const holdEnd=spillDur+c.hold;
      if(cyclePos<spillDur){
        const dt=cyclePos;
        const x=c.restX + c.vx*dt + Math.sin(dt*4+c.id)*.01;
        const y=c.restY + c.vy*dt - .5*c.g*dt*dt;
        const z=-.005 + c.vz*dt;
        const spin=c.spinBase + dt*(5.2+Math.abs(c.spinBase));
        if(y>FLOOR_Y+RADIUS){
          return {x,y,z,rx:Math.PI/2+dt*1.6,ry:spin,rz:spin*.32};
        }
        // Clamp to floor if the ballistic estimate reaches it early.
        const a=.5*c.g, b=-c.vy, cc=FLOOR_Y+RADIUS-c.restY;
        const disc=Math.max(0,b*b-4*a*cc);
        const tLand=(-b+Math.sqrt(disc))/(2*a);
        const lx=c.restX + c.vx*tLand, lz=-.005 + c.vz*tLand;
        return {x:lx,y:FLOOR_Y+RADIUS,z:lz,rx:Math.PI/2+1.55,ry:spin,rz:c.vx*2.4};
      }
      if(cyclePos<holdEnd){
        const a=.5*c.g, b=-c.vy, cc=FLOOR_Y+RADIUS-c.restY;
        const disc=Math.max(0,b*b-4*a*cc);
        const tLand=(-b+Math.sqrt(disc))/(2*a);
        const lx=c.restX + c.vx*tLand, lz=-.005 + c.vz*tLand;
        return {x:lx,y:FLOOR_Y+RADIUS,z:lz,rx:Math.PI/2+1.55,ry:c.spinBase*1.2,rz:c.vx*2.4};
      }
      return null;
    }
    return null;
  }

  function update(t){
    const counts=[0,0,0,0,0]; let visible=0;
    for(const c of coins){
      const pose=updateCoin(c,t); const mesh=meshes[c.type]; const idx=counts[c.type]++;
      if(pose){
        placeCoin(pose.x,pose.y,pose.z,pose.rx,pose.ry,pose.rz,1); visible++;
      } else hide();
      mesh.setMatrixAt(idx,dummy.matrix);
    }
    // Hide unused instances in each InstancedMesh.
    meshes.forEach((m,mi)=>{
      for(let i=counts[mi]; i<countByType; i++){ hide(); m.setMatrixAt(i,dummy.matrix); }
      m.instanceMatrix.needsUpdate=true;
    });
    return visible;
  }

  $('start').onclick=async()=>{
    const btn=$('start'); btn.disabled=true; $('status').textContent='Запуск камеры...';
    try{
      await mindar.start();
      $('replay').hidden=false; $('settings').hidden=false; btn.hidden=true; reset();
      renderer.setAnimationLoop(()=>{
        if(playing){ elapsed=(performance.now()-t0)/1000; if(elapsed>=90){ elapsed=90; playing=false; } }
        update(elapsed);
        if(playing) $('status').textContent=`Анимация: ${elapsed.toFixed(1)} / 90 сек`;
        renderer.render(scene,camera);
      });
    }catch(e){ console.error(e); $('status').textContent='Ошибка камеры: '+(e?.message||String(e)); btn.disabled=false; }
  };
  $('replay').onclick=reset;
  $('settings').onclick=()=>$('debug').style.display=$('debug').style.display==='block'?'none':'block';
  $('scale').oninput=e=>{root.scale.setScalar(+e.target.value); $('sv').textContent=e.target.value;};
  $('yoffset').oninput=e=>{root.position.y=+e.target.value; $('yv').textContent=e.target.value;};
}

$('start').addEventListener('click', async function firstStart(){
  if(initialized||btnLock) return; btnLock=true;
  const btn=$('start'); btn.disabled=true;
  try{
    $('status').textContent='Проверяем файл распознавания...';
    const response=await fetch('./targets.mind',{cache:'no-store'});
    if(!response.ok) throw new Error('targets.mind не найден (HTTP '+response.status+'). Проверь название и расположение файла на GitHub.');
    const bytes=await response.arrayBuffer(); if(bytes.byteLength<100) throw new Error('targets.mind слишком маленький или пустой');
    await initialize(); initialized=true; btnLock=false; btn.disabled=false; btn.onclick();
  }catch(e){ console.error('AR start failed',e); $('status').textContent='Ошибка: '+(e?.message||String(e)); btn.disabled=false; btnLock=false; }
});
window.addEventListener('unhandledrejection',e=>{ console.error(e.reason); $('status').textContent='Ошибка загрузки: '+(e.reason?.message||String(e.reason)); });
</script></body></html>
